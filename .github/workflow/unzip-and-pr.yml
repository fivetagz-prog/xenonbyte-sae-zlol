name: Unzip ZIP and Create Pull Request

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "ZIP file to extract"
        required: true
        default: "stealanegg-main.zip"
      extract_to:
        description: "Folder to extract into (leave empty for repository root)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  unzip-and-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ZIP file
        run: |
          ZIP_FILE="${{ github.event.inputs.zip_file }}"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          echo "✅ Found: $ZIP_FILE"

      - name: Create extraction directory
        run: |
          EXTRACT_TO="${{ github.event.inputs.extract_to }}"

          if [ -z "$EXTRACT_TO" ]; then
            echo "EXTRACT_DIR=." >> "$GITHUB_ENV"
          else
            mkdir -p "$EXTRACT_TO"
            echo "EXTRACT_DIR=$EXTRACT_TO" >> "$GITHUB_ENV"
          fi

      - name: Extract ZIP
        run: |
          ZIP_FILE="${{ github.event.inputs.zip_file }}"

          echo "📦 Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "✅ Extraction completed."

      - name: Remove ZIP file
        run: |
          rm -f "${{ github.event.inputs.zip_file }}"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="unzip-${{ github.run_number }}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          git checkout -b "$BRANCH"

      - name: Commit extracted files
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add -A

          git commit -m "Extract ${{ github.event.inputs.zip_file }}"

      - name: Push branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin "$BRANCH"

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "Extract ${{ github.event.inputs.zip_file }}" \
            --body "## ZIP Extraction

          This Pull Request was automatically created by GitHub Actions.

          **ZIP file:** \`${{ github.event.inputs.zip_file }}\`

          **Extraction folder:** \`${{ github.event.inputs.extract_to || 'repository root' }}\`

          The ZIP contents have been extracted and committed automatically."

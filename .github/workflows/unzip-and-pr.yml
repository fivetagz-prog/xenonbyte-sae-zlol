name: Unzip ZIP and Create PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP files
        run: |
          echo "ZIP files in repository:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found!"
            exit 1
          fi

          echo "✅ Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "✅ ZIP extracted successfully"

      - name: Create branch
        run: |
          BRANCH="unzip-${{ github.run_number }}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Copy extracted files
        run: |
          cp -a extracted/. .
          rm -rf extracted

      - name: Remove ZIP
        run: |
          find . -maxdepth 1 -type f -iname "*.zip" -delete

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract ZIP files"

      - name: Push branch
        run: |
          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Extract ZIP files" \
            --body "Automatically extracted the ZIP file and created this Pull Request."
